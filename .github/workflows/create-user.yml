# Creates a login in Cognito, no terminal needed: Actions → Create user → Run workflow.
# The login is the phone (DDD + number); the e-mail receives the temporary password; the name is how
# partners see each other. If the phone already has a login, only its name is updated (to give a name
# to the logins created before names existed, or to change one).
name: Create user

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment in which to create the user"
        required: true
        type: choice
        options: [dev, producao] # names of the GitHub Environments
      name:
        description: "User's name (e.g. Ana Lima)"
        required: true
        type: string
      phone:
        description: "Phone used to log in: DDD + number, digits only (e.g. 11987654321)"
        required: true
        type: string
      email:
        description: "E-mail that receives the temporary password"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04 # pinned: Playwright has no Chromium for newer Ubuntu yet
    environment: ${{ inputs.environment }}
    env:
      NAME: ${{ inputs.name }} # through variables: typed text is never pasted into the shell
      PHONE: ${{ inputs.phone }}
      EMAIL: ${{ inputs.email }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create the user (or update their name)
        run: |
          NAME="$(printf '%s' "$NAME" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ -z "$NAME" ] || [ "${#NAME}" -gt 80 ]; then
            echo "::error::Invalid name: type the user's name (up to 80 characters)."
            exit 1
          fi
          if ! printf '%s' "$PHONE" | grep -Eq '^[1-9]{2}[0-9]{8,9}$'; then
            echo "::error::Invalid phone: type DDD + number, digits only (10 or 11 digits)."
            exit 1
          fi
          if ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "::error::Invalid e-mail."
            exit 1
          fi
          TF_ENVIRONMENT="dev"
          [ "$ENVIRONMENT" = "producao" ] && TF_ENVIRONMENT="prod"
          POOL="$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='many-houses-${TF_ENVIRONMENT}-login'].Id | [0]" --output text)"
          if [ -z "$POOL" ] || [ "$POOL" = "None" ]; then
            echo "::error::Could not find this environment's Cognito user pool. Deploy the environment first."
            exit 1
          fi
          # Attributes as JSON (built by jq): a name with commas or quotes is passed as it is.
          NAME_ATTRIBUTE="$(jq -cn --arg v "$NAME" '[{Name: "name", Value: $v}]')"
          if aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "+55$PHONE" > /dev/null 2>&1; then
            aws cognito-idp admin-update-user-attributes --user-pool-id "$POOL" --username "+55$PHONE" \
              --user-attributes "$NAME_ATTRIBUTE"
            echo "User $PHONE already existed in **$ENVIRONMENT**: their name was updated (it shows after their next login)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The username is the phone in international format (+55...); the temporary password goes by e-mail.
          ATTRIBUTES="$(jq -cn --arg name "$NAME" --arg phone "+55$PHONE" --arg email "$EMAIL" '[
            {Name: "name", Value: $name},
            {Name: "phone_number", Value: $phone}, {Name: "phone_number_verified", Value: "true"},
            {Name: "email", Value: $email}, {Name: "email_verified", Value: "true"}]')"
          aws cognito-idp admin-create-user --user-pool-id "$POOL" --username "+55$PHONE" \
            --user-attributes "$ATTRIBUTES" --desired-delivery-mediums EMAIL > /dev/null
          echo "User $PHONE created in **$ENVIRONMENT**. The temporary password was sent by e-mail." >> "$GITHUB_STEP_SUMMARY"
